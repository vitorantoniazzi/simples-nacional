[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simples-nacional-complexo"
version = "0.1.0"
description = "Cálculo do Simples Nacional a partir das tabelas legais: alíquota efetiva, Fator R e RBT12 proporcional."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vitor Antoniazzi" }]
keywords = ["simples-nacional", "tributos", "fiscal", "brasil", "das", "fator-r"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vitorantoniazzi/simples-nacional"
Issues = "https://github.com/vitorantoniazzi/simples-nacional/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/simples_nacional"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# A fórmula legal usa os sinais matemáticos de verdade; trocá-los por "x" e "-"
# tornaria a citação da lei menos legível do que ela é.
allowed-confusables = ["×", "−", "÷", "º"]

[tool.ruff.lint.per-file-ignores]
# Anexo.I não é uma variável mal nomeada: "I" é como a lei nomeia o anexo.
"src/simples_nacional/tabelas.py" = ["E741"]

[tool.mypy]
strict = true
python_version = "3.10"
